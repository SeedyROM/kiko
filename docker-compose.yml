version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: crates/kiko-backend/Dockerfile
    container_name: kiko-backend
    ports:
      - "3030:3030"
    environment:
      - RUST_LOG=info
      - PORT=3030
      - KIKO_CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://localhost:8080,http://localhost:8081,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:8000,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:5173
      - KIKO_SESSION_CLEANUP_INTERVAL=60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 1s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - kiko-network

  frontend:
    build:
      context: .
      dockerfile: crates/kiko-frontend/Dockerfile
    container_name: kiko-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 1s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - kiko-network

networks:
  kiko-network:
    driver: bridge

# Production override available in docker-compose.prod.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up