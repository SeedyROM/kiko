version: '3.8'

services:
  backend:
    environment:
      - RUST_LOG=warn
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    ports:
      - "80:8080"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M