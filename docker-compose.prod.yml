version: '3.8'

services:
  backend:
    image: sleazyrom/kiko-backend:latest
    environment:
      - RUST_LOG=warn
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    image: sleazyrom/kiko-frontend:latest
    ports:
      - "80:8080"
    environment:
      - API_BASE_URL=/api/v1
      - WS_URL=/api/v1/ws
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M