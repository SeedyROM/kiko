version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: kiko-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-bootstrap.conf:/etc/nginx/nginx-bootstrap.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - kiko-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  certbot:
    image: certbot/certbot
    container_name: kiko-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - nginx
    profiles:
      - certbot

  backend:
    image: sleazyrom/kiko-backend:latest
    environment:
      - RUST_LOG=warn
      - KIKO_BACKEND_BIND=0.0.0.0  # Bind to all interfaces within container
    ports: []  # Remove external port exposure - only accessible via nginx proxy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    image: sleazyrom/kiko-frontend:latest
    ports: []  # Remove external port exposure - only accessible via nginx proxy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  certbot-etc:
  certbot-var:
  web-root: