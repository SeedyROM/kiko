name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: rustfmt, clippy
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "."
        cache-all-crates: true
    
    - name: Install Trunk (only if needed)
      run: |
        if ! command -v trunk &> /dev/null; then
          cargo install trunk --locked
        fi
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'tests/e2e/package-lock.json'
    
    - name: Cache TailwindCSS
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-tailwindcss-${{ hashFiles('**/package-lock.json') }}
    
    - name: Install dependencies
      run: |
        npm install -g tailwindcss
        cd tests/e2e && npm ci
    
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    
    - name: Install Playwright Browsers
      run: cd tests/e2e && npx playwright install --with-deps
    
    - name: Build project (optimized for testing)
      run: |
        # Build backend in debug mode for faster compilation
        cargo build
        # Build frontend in release mode (WASM benefits from optimization)
        cd crates/kiko-frontend && RUSTFLAGS="-C target-feature=-nontrapping-fptoint" trunk build --release
    
    - name: Run E2E tests (Chrome only, parallel)
      run: cd tests/e2e && npx playwright test --project=chromium
      env:
        CI: true
    
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-screenshots
        path: tests/e2e/test-screenshots/
        retention-days: 30