[package]
name = "kiko-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
kiko = { path = "../kiko" }

async-trait = "0.1.88"
axum = { version = "0.8.4", features = ["ws"] }
chrono = "0.4.41"
dashmap = "6.1.0"
tokio = { version = "1.45.0", features = ["full"] }
tower = "0.5.2"
tower_governor = { version = "0.3" }
tower-http = { version = "0.6.4", features = ["cors", "trace"] }
arc-swap = "1.7.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"
rand = "0.8"
futures = "0.3"

[[bench]]
name = "pubsub"
harness = false

[[bench]]
name = "session_service"
harness = false
